
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Runner Game</title>
<style>
* { margin: 0; padding: 0; }
body {
  overflow: hidden;
  font-family: Arial;
  background: #87ceeb;
}
#ui {
  position: absolute;
  top: 20px;
  left: 20px;
  color: white;
  font-size: 24px;
  font-weight: bold;
  text-shadow: 2px 2px 4px black;
}
#help {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  background: #0009;
  padding: 12px 20px;
  border-radius: 10px;
}
#gameover {
  display: none;
  position: absolute;
  inset: 0;
  background: #000b;
  color: white;
  text-align: center;
  padding-top: 20vh;
}
button {
  padding: 12px 25px;
  font-size: 20px;
  cursor: pointer;
}
</style>
</head>
<body>

<div id="ui">
  🪙 Монеты: <span id="coins">0</span>
  <br>
  ⭐ Счёт: <span id="score">0</span>
</div>

<div id="help">
  WASD / Стрелки — движение | SPACE — прыжок
</div>

<div id="gameover">
  <h1>ИГРА ОКОНЧЕНА!</h1>
  <p id="final"></p>
  <br>
  <button onclick="restart()">Играть снова</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 15, 65);

const camera = new THREE.PerspectiveCamera(
  70, window.innerWidth/window.innerHeight, 0.1, 1000
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));

const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-5,10,5);
sun.castShadow = true;
scene.add(sun);

// Земля
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200,200),
  new THREE.MeshStandardMaterial({color:0x398c35})
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.1;
scene.add(ground);

// Дорога
const road = new THREE.Mesh(
  new THREE.BoxGeometry(10,0.2,200),
  new THREE.MeshStandardMaterial({color:0x444444})
);
road.position.set(0,-0.05,-70);
scene.add(road);

// Разметка
for(let z=5;z>-150;z-=8){
  const line = new THREE.Mesh(
    new THREE.BoxGeometry(0.15,0.03,4),
    new THREE.MeshBasicMaterial({color:0xffffff})
  );
  line.position.set(0,0.07,z);
  scene.add(line);
}

// Деревья
for(let i=0;i<60;i++){
  const z = -Math.random()*160;
  for(let side of [-1,1]){
    const x = side*(7+Math.random()*12);
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.2,0.3,2),
      new THREE.MeshStandardMaterial({color:0x754321})
    );
    trunk.position.set(x,1,z);
    scene.add(trunk);

    const leaves = new THREE.Mesh(
      new THREE.ConeGeometry(1.5,4,7),
      new THREE.MeshStandardMaterial({color:0x087a25})
    );
    leaves.position.set(x,3.5,z);
    scene.add(leaves);
  }
}

// Игрок
const player = new THREE.Group();

const body = new THREE.Mesh(
  new THREE.BoxGeometry(0.8,1.2,0.5),
  new THREE.MeshStandardMaterial({color:0x2266ff})
);
body.position.y=1.1;
player.add(body);

const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.38,16,16),
  new THREE.MeshStandardMaterial({color:0xffcc99})
);
head.position.y=2;
player.add(head);

const legs = [];
for(let x of [-0.23,0.23]){
  const leg = new THREE.Mesh(
    new THREE.BoxGeometry(0.25,0.7,0.3),
    new THREE.MeshStandardMaterial({color:0x222222})
  );
  leg.position.set(x,0.35,0);
  player.add(leg);
  legs.push(leg);
}
scene.add(player);

// Монеты
const coins = [];
function createCoin(z){
  const coin = new THREE.Mesh(
    new THREE.TorusGeometry(0.4,0.12,8,20),
    new THREE.MeshStandardMaterial({
      color:0xffd700,
      metalness:0.8,
      roughness:0.2
    })
  );
  coin.position.set([-3,0,3][Math.floor(Math.random()*3)],1,z);
  scene.add(coin);
  coins.push(coin);
}

// Препятствия
const obstacles = [];
function createObstacle(z){
  const obstacle = new THREE.Mesh(
    new THREE.BoxGeometry(1.5,1.5,1.5),
    new THREE.MeshStandardMaterial({color:0xe52b20})
  );
  obstacle.position.set([-3,0,3][Math.floor(Math.random()*3)],0.75,z);
  scene.add(obstacle);
  obstacles.push(obstacle);
}

for(let i=0;i<15;i++){
  createCoin(-10-i*10);
  if(i%2===0) createObstacle(-20-i*12);
}

// Управление
let keys={};
let velocityY=0;
let jumping=false;
let score=0;
let coinCount=0;
let speed=0.25;
let alive=true;

document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Space' && !jumping && alive){
    velocityY=0.23;
    jumping=true;
  }
});
document.addEventListener('keyup',e=>keys[e.code]=false);

function restart(){
  location.reload();
}

function endGame(){
  alive=false;
  document.getElementById('gameover').style.display='block';
  document.getElementById('final').innerText=
    'Счёт: '+score+' | Монеты: '+coinCount;
}

function animate(){
  requestAnimationFrame(animate);

  if(alive){
    score++;

    if(keys.ArrowLeft || keys.KeyA)
      player.position.x-=0.12;
    if(keys.ArrowRight || keys.KeyD)
      player.position.x+=0.12;

    if(keys.ArrowUp || keys.KeyW)
      player.position.z-=0.1;
    if(keys.ArrowDown || keys.KeyS)
      player.position.z+=0.1;

    player.position.x=Math.max(-4,Math.min(4,player.position.x));
    player.position.z=Math.max(-5,Math.min(3,player.position.z));

    player.position.y+=velocityY;
    velocityY-=0.012;

    if(player.position.y<0){
      player.position.y=0;
      velocityY=0;
      jumping=false;
    }

    legs.forEach((leg,i)=>{
      leg.rotation.x=Math.sin(score*0.2+i*Math.PI)*0.5;
    });

    coins.forEach(coin=>{
      coin.rotation.y+=0.08;
      coin.position.z+=speed;

      if(coin.position.distanceTo(
        new THREE.Vector3(player.position.x,player.position.y+1,player.position.z)
      )<1){
        coin.position.z=100;
        coinCount++;
        document.getElementById('coins').innerText=coinCount;
      }
    });

    obstacles.forEach(ob=>{
      ob.position.z+=speed;

      if(
        Math.abs(ob.position.x-player.position.x)<1 &&
        Math.abs(ob.position.z-player.position.z)<1 &&
        player.position.y<1
      ){
        endGame();
      }

      if(ob.position.z>10){
        ob.position.z=-100-Math.random()*50;
        ob.position.x=[-3,0,3][Math.floor(Math.random()*3)];
      }
    });

    speed=Math.min(0.55,0.25+score/100000);
    document.getElementById('score').innerText=score;
  }

  camera.position.set(
    player.position.x*0.4,
    5+player.position.y*0.3,
    player.position.z+9
  );
  camera.lookAt(player.position.x,1,player.position.z-5);

  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

animate();
</script>
</body>
</html>
